<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Prévia conceitual do NEMESIS Tutor</title>
  <desc id="desc">Ilustração conceitual da bolinha flutuante e mini chat do NEMESIS Tutor em estilo preto e cinza.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#585858"/><stop offset="1" stop-color="#3e3e3e"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#080808"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#383838"/><stop offset="1" stop-color="#171717"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter></defs>
  <rect width="1400" height="850" rx="24" fill="url(#bg)"/>
  <rect x="42" y="35" width="1316" height="780" rx="28" fill="#000" opacity=".22" filter="url(#shadow)"/>
  <rect x="45" y="36" width="390" height="778" rx="26" fill="url(#card)" stroke="#666" stroke-width="1.5"/>
  <text x="78" y="82" fill="#f3f3f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">NEMESIS TUTOR</text><text x="78" y="108" fill="#929292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.5">DESKTOP · MONOCHROME GLASS</text>
  <text x="78" y="165" fill="#9f9f9f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">01 / MINIMIZADO</text><text x="78" y="208" fill="#f5f5f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Um tutor na sua área</text><text x="78" y="236" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">A bolinha fica acima das outras janelas.</text>
  <circle cx="240" cy="380" r="74" fill="#aaa" opacity=".07"/><circle cx="240" cy="380" r="56" fill="#111" stroke="#e6e6e6" stroke-width="3"/><circle cx="240" cy="380" r="46" fill="none" stroke="#858585" stroke-width="1.5"/><path d="M222 399V361L258 399V361" fill="none" stroke="#f3f3f3" stroke-width="4" stroke-linecap="round"/><text x="240" y="470" fill="#f3f3f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="800">NEMESIS</text><text x="240" y="495" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Clique para abrir o mini chat</text>
  <rect x="73" y="536" width="334" height="35" rx="17" fill="#242424" stroke="#525252"/><text x="91" y="558" fill="#c2c2c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">ARRASTE PARA MOVER · SEM NAVEGADOR</text>
  <rect x="470" y="36" width="885" height="778" rx="28" fill="url(#card)" stroke="#777" stroke-width="1.5"/>
  <circle cx="514" cy="79" r="23" fill="url(#panel)" stroke="#bbb"/><path d="M505 89V69L523 89V69" fill="none" stroke="#fff" stroke-width="2.5"/><text x="550" y="76" fill="#f3f3f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">NEMESIS</text><text x="550" y="96" fill="#999" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1">CYBERSECURITY TUTOR</text>
  <rect x="1108" y="61" width="150" height="34" rx="9" fill="#202020" stroke="#484848"/><text x="1183" y="82" fill="#ddd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="700">NVIDIA API</text><rect x="1271" y="61" width="45" height="34" rx="9" fill="#1b1b1b" stroke="#484848"/><text x="1293" y="83" fill="#eee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">⚙</text>
  <rect x="500" y="125" width="820" height="84" rx="16" fill="#202020" stroke="#484848"/><text x="524" y="157" fill="#f1f1f1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Seu copiloto de laboratório</text><text x="524" y="184" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Interprete saídas, valide hipóteses e aprenda o próximo passo.</text>
  <rect x="500" y="230" width="820" height="425" rx="18" fill="#090909" stroke="#393939"/>
  <rect x="720" y="260" width="565" height="70" rx="15" fill="#292929" stroke="#575757"/><text x="741" y="284" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">VOCÊ</text><text x="741" y="309" fill="#f1f1f1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Esse resultado do scan é relevante? O que verifico agora?</text>
  <rect x="532" y="354" width="700" height="206" rx="15" fill="#171717" stroke="#484848"/><text x="557" y="382" fill="#aaa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">NEMESIS</text><text x="557" y="417" fill="#f2f2f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Leitura preliminar</text><text x="557" y="451" fill="#d1d1d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">• Separe o que a saída mostra das hipóteses.</text><text x="557" y="480" fill="#d1d1d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">• Confirme o escopo e valide o resultado sem ações destrutivas.</text><text x="557" y="509" fill="#d1d1d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">• Registre a ferramenta, os parâmetros, horário e evidência original.</text><text x="557" y="539" fill="#969696" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Ilustração conceitual — a resposta real depende dos dados enviados à API.</text>
  <rect x="500" y="675" width="820" height="88" rx="15" fill="#171717" stroke="#484848"/><text x="526" y="711" fill="#858585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Pergunte sobre um comando, resultado ou conceito…</text><path d="M525 729H1295" stroke="#3f3f3f"/><rect x="520" y="739" width="158" height="37" rx="10" fill="#282828" stroke="#555"/><text x="599" y="762" fill="#ddd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="700">◎ Analisar tela</text><rect x="1150" y="739" width="145" height="37" rx="10" fill="#eee"/><text x="1222" y="762" fill="#111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="800">Enviar ↑</text>
  <text x="700" y="795" fill="#777" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing=".8">CAPTURA SOMENTE AO CLICAR · ENVIO EXPLÍCITO À NVIDIA</text>
</svg>