<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do NEMESIS Tutor</title>
  <desc id="desc">Fluxo entre mini chat, análise de tela, API NVIDIA e relatório Markdown; a aplicação não executa comandos no computador.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070909"/><stop offset="1" stop-color="#171b19"/></linearGradient><linearGradient id="accent"><stop stop-color="#147b49"/><stop offset="1" stop-color="#24e98a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#20cf7a"/></marker></defs>
  <rect width="1400" height="570" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" fill="#f3f7f4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Como funciona</text>
  <text x="54" y="91" fill="#91a098" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Fluxo de orientação com envio explícito de dados e sem execução automática de comandos.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="155" width="330" height="126" rx="18" fill="#101513" stroke="#44534a" stroke-width="1.5"/>
    <circle cx="95" cy="195" r="17" fill="#11281c" stroke="#1dd97b"/><text x="95" y="201" fill="#45e994" font-size="19" text-anchor="middle" font-weight="800">1</text>
    <text x="125" y="197" fill="#f0f5f2" font-size="21" font-weight="700">Interface desktop</text><text x="80" y="232" fill="#a8b4ad" font-size="16">Bolinha flutuante e mini chat</text><text x="80" y="256" fill="#a8b4ad" font-size="16">Entrada manual de perguntas</text>
    <rect x="55" y="322" width="330" height="126" rx="18" fill="#101513" stroke="#44534a" stroke-width="1.5"/>
    <circle cx="95" cy="362" r="17" fill="#11281c" stroke="#1dd97b"/><text x="95" y="368" fill="#45e994" font-size="19" text-anchor="middle" font-weight="800">2</text>
    <text x="125" y="364" fill="#f0f5f2" font-size="21" font-weight="700">Captura sob demanda</text><text x="80" y="399" fill="#a8b4ad" font-size="16">O usuário confirma antes de enviar</text><text x="80" y="423" fill="#a8b4ad" font-size="16">Não há gravação contínua</text>
    <rect x="535" y="195" width="340" height="210" rx="22" fill="#101713" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="705" cy="243" r="25" fill="#11281c" stroke="#1dd97b" stroke-width="1.5"/><path d="M694 254v-22l22 22v-22" fill="none" stroke="#e8f3ec" stroke-width="3" stroke-linecap="round"/>
    <text x="705" y="299" fill="#f2f7f4" font-size="24" font-weight="800" text-anchor="middle">API NVIDIA</text><text x="705" y="331" fill="#a8b4ad" font-size="16" text-anchor="middle">Modelo de texto: tutoria</text><text x="705" y="356" fill="#a8b4ad" font-size="16" text-anchor="middle">Modelo visual: imagem, quando suportado</text><text x="705" y="381" fill="#75dda4" font-size="14" text-anchor="middle">integrate.api.nvidia.com/v1</text>
    <rect x="1025" y="155" width="320" height="126" rx="18" fill="#101513" stroke="#44534a" stroke-width="1.5"/>
    <circle cx="1065" cy="195" r="17" fill="#11281c" stroke="#1dd97b"/><text x="1065" y="201" fill="#45e994" font-size="19" text-anchor="middle" font-weight="800">3</text>
    <text x="1095" y="197" fill="#f0f5f2" font-size="21" font-weight="700">Orientação</text><text x="1050" y="232" fill="#a8b4ad" font-size="16">Fatos, hipóteses e incertezas</text><text x="1050" y="256" fill="#a8b4ad" font-size="16">Próximos passos seguros</text>
    <rect x="1025" y="322" width="320" height="126" rx="18" fill="#101513" stroke="#44534a" stroke-width="1.5"/>
    <circle cx="1065" cy="362" r="17" fill="#11281c" stroke="#1dd97b"/><text x="1065" y="368" fill="#45e994" font-size="19" text-anchor="middle" font-weight="800">4</text>
    <text x="1095" y="364" fill="#f0f5f2" font-size="21" font-weight="700">Relatório Markdown</text><text x="1050" y="399" fill="#a8b4ad" font-size="16">Escopo, evidências e limitações</text><text x="1050" y="423" fill="#a8b4ad" font-size="16">Recomendações e exportação .md</text>
    <path d="M385 215H515" fill="none" stroke="#20cf7a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 385H450Q475 385 475 360V290Q475 270 515 270" fill="none" stroke="#20cf7a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875 245H1005" fill="none" stroke="#20cf7a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875 360H980Q1005 360 1005 385H1005" fill="none" stroke="#20cf7a" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <rect x="55" y="490" width="1290" height="42" rx="12" fill="#101513" stroke="#37443c"/>
  <text x="75" y="516" fill="#8ee8b6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">SEGURANÇA:</text><text x="191" y="516" fill="#c3ccc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">o tutor analisa dados fornecidos, orienta o usuário e não executa comandos nem controla teclado/mouse.</text>
</svg>